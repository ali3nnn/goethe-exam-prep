<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungstraining A1 · Start Deutsch 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E6E9E2; --paper:#FFFFFF; --ink:#222; --muted:#62675E; --rule:#CDD2C6; --soft:#F3F5EF;
  --green:#A0C814; --greenInk:#476000; --ok:#2E7D32; --okbg:#E6F3E2; --bad:#B3261E; --badbg:#FBE7E5; --warn:#B26A00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#121510; --paper:#1D211A; --ink:#EDEFEA; --muted:#A3A99C; --rule:#343A2E; --soft:#262B22;
  --greenInk:#C3E35A; --okbg:#1E3320; --badbg:#3D1C1A; --ok:#7BC67E; --bad:#FF8A80;
}}
:root[data-theme="dark"]{
  --desk:#121510; --paper:#1D211A; --ink:#EDEFEA; --muted:#A3A99C; --rule:#343A2E; --soft:#262B22;
  --greenInk:#C3E35A; --okbg:#1E3320; --badbg:#3D1C1A; --ok:#7BC67E; --bad:#FF8A80;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.sheet{max-width:720px;margin:16px auto 40px;background:var(--paper);box-shadow:0 1px 0 var(--rule),0 0 0 1px var(--rule);padding:0 0 28px}
@media(max-width:740px){.sheet{margin:0 0 24px;box-shadow:none}}
.pad{padding:0 20px}

/* exam booklet header */
.mast{display:flex;align-items:stretch;border-bottom:3px solid var(--green)}
.mast .tag{background:var(--green);color:#1d2600;font-weight:900;padding:14px 16px;font-size:1.6rem;line-height:1;display:flex;align-items:center}
.mast .ttl{padding:10px 16px;display:flex;flex-direction:column;justify-content:center}
.mast .ttl b{font-size:1.15rem;line-height:1.2}
.mast .ttl span{color:var(--muted);font-size:.9rem}
h1{font-size:2rem;line-height:1.1;margin:24px 0 6px;font-weight:900}
h2{font-size:1.45rem;margin:26px 0 4px;font-weight:900}
h3{font-size:1.1rem;margin:22px 0 6px}
.muted{color:var(--muted)}
.en{color:var(--muted);font-size:.9rem;font-style:italic}

/* cover */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
.fields label{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.fields input{width:100%;font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--ink);padding:4px 2px;font-size:1.1rem}
table.mods{width:100%;border-collapse:collapse;margin:8px 0 18px}
table.mods th{font-size:.8rem;color:var(--muted);text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:6px 4px}
table.mods td{padding:10px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.mods td:last-child{text-align:right;white-space:nowrap}table.mods td:nth-child(2){white-space:nowrap}
.status{font-weight:700;font-size:.9rem}
.status.done{color:var(--ok)}
.btn{border:0;border-radius:4px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.green{background:var(--green);color:#1d2600}
.btn.line{background:transparent;border:2px solid var(--rule);color:var(--ink);padding:10px 16px}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--rule);background:var(--soft);padding:12px 16px;margin:14px 0}

/* exam bar */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar .in{display:flex;align-items:center;gap:10px;padding:8px 20px}
.bar .mod{font-weight:900}
.bar .teile{display:flex;gap:4px;margin-left:6px}
.bar .teile button{border:1px solid var(--rule);background:transparent;border-radius:3px;padding:2px 8px;font-size:.85rem;cursor:pointer}
.clock{margin-left:auto;font-weight:900;font-size:1.15rem;padding:2px 10px;border:2px solid var(--ink);border-radius:4px;min-width:74px;text-align:center}
.clock.low{border-color:var(--bad);color:var(--bad)}
@media(max-width:480px){.bar .teile{display:none}}

/* tasks */
.teil{border-top:2px solid var(--ink);margin-top:28px;padding-top:4px}
.teil h2{margin-top:10px;display:flex;align-items:baseline;gap:10px}
.instr{margin:4px 0 14px}
.instr b{background:var(--green);color:#1d2600;padding:0 4px}
.task{padding:14px 0;border-bottom:1px solid var(--rule)}
.task.bsp{background:var(--soft);margin:0 -20px;padding:14px 20px}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.no{font-weight:900;font-size:1.25rem;min-width:28px}
.bsp .no{font-size:.95rem;color:var(--muted)}
.ctx{color:var(--muted)}
.q{font-weight:700;margin:4px 0 10px}
.opts{display:grid;gap:6px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid var(--rule);border-radius:4px;padding:9px 12px;cursor:pointer;min-height:46px}
.opt .x{width:22px;height:22px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;font-weight:900;line-height:1}
.opt .l{font-weight:700;width:14px;flex:none}
.opt.sel .x::after{content:"✕"}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt>span:last-child{overflow-wrap:anywhere;min-width:0}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* audio player */
.player{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:8px 10px;background:var(--soft);border:1px solid var(--rule);border-radius:4px}
.player .pb{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.player .pb:disabled{opacity:.35;cursor:default}
.player .pb svg{width:16px;height:16px}
.player .track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.player .fill{height:100%;width:0;background:var(--green)}
.player .cnt{font-size:.85rem;font-weight:700;white-space:nowrap}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
.dots i.used{background:var(--ink)}

/* reading */
.doc{border:1px solid var(--ink);padding:14px 16px;margin:12px 0;white-space:pre-line;background:var(--paper)}
.doc .k{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.sites{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
@media(max-width:520px){.sites{grid-template-columns:1fr}}
.site{border:1px solid var(--ink);font-size:.9rem}
.site .u{border-bottom:1px solid var(--ink);padding:3px 8px;font-weight:700;font-size:.8rem;display:flex;gap:6px;overflow-wrap:anywhere}
.site .u i{font-style:normal;background:var(--ink);color:var(--paper);padding:0 5px}
.site .b{padding:8px 10px;white-space:pre-line;line-height:1.35}
table.tt{border-collapse:collapse;width:100%;font-size:.88rem}
table.tt td,table.tt th{padding:2px 4px;border-bottom:1px solid var(--rule);text-align:left}
.sign{border:3px double var(--ink);padding:12px 14px;margin:6px 0 10px;white-space:pre-line;font-weight:600;text-align:center}
.where{font-size:.85rem;color:var(--muted);display:block;text-align:left;font-weight:400}

/* answer sheet */
.ab{margin-top:22px;border:2px solid var(--ink);padding:10px 12px}
.ab h4{margin:0 0 6px;font-size:.95rem}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.abgrid span{border:1px solid var(--rule);text-align:center;padding:2px 0;font-size:.85rem}
.abgrid span b{display:block;font-size:1rem}
.abgrid span.e{color:var(--muted)}

/* writing */
.form{border:2px solid var(--ink);padding:14px 16px;margin:12px 0}
.form h4{margin:0 0 10px}
.fld{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--rule)}
.fld label{font-size:.92rem;color:var(--muted)}
.fld input[type=text]{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:4px 2px;width:100%}
.fld input[readonly]{font-family:"Segoe Script","Bradley Hand",cursive;color:var(--muted);border-bottom-style:dotted}
.fld input.right{background:var(--okbg)} .fld input.wrong{background:var(--badbg)}
.fld .fix{grid-column:2;font-size:.85rem;color:var(--ok);font-weight:700}
.nr{display:inline-block;border:1px solid var(--ink);font-size:.75rem;padding:0 4px;margin-left:4px;color:var(--ink)}
.radio{display:flex;gap:16px} .radio label{color:var(--ink);display:flex;gap:6px;align-items:center}
textarea{font:inherit;color:inherit;width:100%;min-height:200px;background:repeating-linear-gradient(transparent,transparent 31px,var(--rule) 32px);line-height:32px;border:1px solid var(--ink);padding:0 10px}
.rate{display:grid;gap:6px;margin:10px 0}
.rate .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--rule)}
.rate .r span{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.feedback{white-space:pre-line;border-left:4px solid var(--green);padding:8px 14px;background:var(--soft);margin:10px 0}

/* speaking */
.card{border:2px solid var(--ink);border-radius:6px;padding:14px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:var(--paper)}
.card .top{font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:6px}
.card .w{font-size:1.8rem;font-weight:900}
.card .em{font-size:3rem;line-height:1.1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.kw span{border:2px solid var(--ink);padding:4px 12px;font-weight:700}
.examiner{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px 12px;background:var(--soft);border:1px solid var(--rule)}
.examiner .who{font-weight:900;font-size:.85rem;white-space:nowrap;padding-top:2px}
.examiner .say{flex:1}
.spk{border:1px solid var(--ink);background:transparent;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}

/* results */
.cert{border:2px solid var(--ink);padding:18px;margin:16px 0;position:relative}
.cert .stamp{position:absolute;right:14px;top:14px;border:3px solid var(--ok);color:var(--ok);font-weight:900;padding:4px 10px;transform:rotate(-6deg);text-transform:none}
.cert .stamp.no{border-color:var(--bad);color:var(--bad)}
table.res{width:100%;border-collapse:collapse;margin-top:10px}
table.res td,table.res th{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left}
table.res td.n,table.res th.n{text-align:right}
table.res tr.tot td{border-top:2px solid var(--ink);font-weight:900;font-size:1.1rem}
.meter{height:10px;background:var(--rule);position:relative;margin:14px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.meter b{position:absolute;left:60%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
dialog{border:2px solid var(--ink);padding:20px;max-width:420px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.modes{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);margin:14px 0 16px}
.modes button{background:transparent;border:0;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.modes button+button{border-left:2px solid var(--ink)}
.modes button small{color:var(--muted);font-size:.82rem;line-height:1.3}
.modes button.on{background:var(--green);color:#1d2600}
.modes button.on small{color:#2f3d00}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--ink);margin:14px 0 0}
.sets button{background:transparent;border:0;padding:9px 6px;font-weight:700;cursor:pointer;font-size:.95rem}
.sets button+button{border-left:2px solid var(--ink)}
.sets button.on{background:var(--ink);color:var(--paper)}
.radio{flex-wrap:wrap;row-gap:4px}
.pill{font-size:.75rem;font-weight:700;background:var(--green);color:#1d2600;padding:1px 8px;border-radius:999px;margin-left:6px}
.pcheck{margin:14px 0 4px}
.score{font-weight:900;color:var(--bad)} .score.full{color:var(--ok)}
.foot{font-size:.82rem;color:var(--muted);margin-top:26px}
@media (prefers-reduced-motion:no-preference){.player .fill{transition:width .2s linear}}
</style>
</head>

const SETS={ms:{name:"Modellsatz",HOEREN,LESEN,FORM,SP2,SP3,W},ue1:UE1,ue2:UE2};
let SET="ms";try{SET=localStorage.getItem("a1-set")||"ms";}catch(e){}
if(SETS[location.hash.slice(1)])SET=location.hash.slice(1);
if(!SETS[SET])SET="ms";
function useSet(id){SET=id;({HOEREN,LESEN,FORM,SP2,SP3,W}=SETS[id]);}
useSet(SET);

const HAS_AI=!!(window.claude&&window.claude.use);

const key=()=>KEYS[MODE]+(SET==="ms"?"":"-"+SET);
const PR=()=>MODE==="practice";
const fresh=()=>({cand:{name:"",nr:""},screen:"cover",mod:null,full:false,deadline:null,ans:{},plays:{},form:{},letter:"",w2:null,sp:{},done:{},review:null,cards:null,chk:{}});
let S;
function load(){S=fresh();try{const r=localStorage.getItem(key());if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}}
load();
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(S));localStorage.setItem("a1-mode",MODE);localStorage.setItem("a1-set",SET);}catch(e){}};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const app=$("#app");
const today=new Date().toLocaleDateString("de-DE");
const words=t=>(t.match(/\S+/g)||[]).length;

/* ---------- scoring ---------- */
const realItems=parts=>parts.flatMap(p=>p.items.filter(i=>i.n>0).map(i=>({...i,p})));
const rawChoice=(parts,pre)=>realItems(parts).filter(i=>S.ans[pre+i.n]===i.a).length;
const norm=v=>(v||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[–—]/g,"-").replace(/[.!]$/,"");
const formOk=f=>{const v=S.form[f.k];if(f.radio)return v===f.ok[0];const n=norm(v);return f.ok.some(o=>o instanceof RegExp?o.test(n):typeof o==="function"?o(n):o===n);};
const rawForm=()=>FORM.filter(formOk).length;
const rawW2=()=>(S.w2&&S.w2.total)||0;
const SPK=[["t1a","Teil 1","Sich vorgestellt (Name, Alter, Land …)",1],["t1b","Teil 1","Namen buchstabiert",1],["t1c","Teil 1","Zahl / Telefonnummer gesagt",1],
 ["t2a","Teil 2","Frage zu Karte 1 gestellt",1.5],["t2b","Teil 2","Auf die Frage des Prüfers geantwortet",1.5],["t2c","Teil 2","Frage zu Karte 2 gestellt",1.5],["t2d","Teil 2","Auf die zweite Frage geantwortet",1.5],
 ["t3a","Teil 3","Bitte zu Karte 1 formuliert",1.5],["t3b","Teil 3","Auf die Bitte des Prüfers reagiert",1.5],["t3c","Teil 3","Bitte zu Karte 2 formuliert",1.5],["t3d","Teil 3","Auf die zweite Bitte reagiert",1.5]];
const rawSp=()=>SPK.reduce((s,[k,,,w])=>s+(S.sp[k]===2?w:S.sp[k]===1?w/2:0),0);
function raw(k){return k==="hoeren"?rawChoice(HOEREN,"h"):k==="lesen"?rawChoice(LESEN,"l"):k==="schreiben"?rawForm()+rawW2():rawSp();}
const conv=r=>Math.round(r*100/60*10)/10; // 15 raw -> 25 points
function grade(p){return p>=90?"sehr gut":p>=80?"gut":p>=70?"befriedigend":p>=60?"ausreichend":"nicht bestanden";}

/* ---------- audio ---------- */
let curAudio=null,curKey=null;
const playSvg='<svg viewBox="0 0 16 16"><path d="M4 2v12l10-6z" fill="currentColor"/></svg>';
const stopSvg='<svg viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10" fill="currentColor"/><rect x="9" y="3" width="3" height="10" fill="currentColor"/></svg>';
function limitFor(id){const p=HOEREN.find(p=>p.items.some(i=>i.audio===id));return p.times==="1×"?1:2;}
function player(id,ex){
  const lim=limitFor(id), used=S.plays[id]||0, free=ex||S.review||PR();
  const left=free?1:lim-used, playing=curKey===id;
  return `<div class="player" data-player="${id}"><button class="pb" data-play="${id}" ${left<=0&&!playing?"disabled":""} aria-label="${playing?"Pause":"Abspielen"}">${playing?stopSvg:playSvg}</button>
   <div class="track"><div class="fill" id="fill-${id}"></div></div>
   <span class="cnt">${free?"frei":`${Math.min(used,lim)}/${lim}`}<span class="dots">${free?"":Array.from({length:lim},(_,k)=>`<i class="${k<used?"used":""}"></i>`).join("")}</span></span></div>`;
}
function togglePlay(id,ex){
  if(curKey===id&&curAudio){curAudio.pause();curAudio=null;curKey=null;render();return;}
  if(curAudio){curAudio.pause();}
  const free=ex||S.review||PR(), lim=limitFor(id);
  if(!free&&(S.plays[id]||0)>=lim) return;
  const a=new Audio("audio/"+SET+"/"+id.replace(".mp4","")+".mp3");
  curAudio=a;curKey=id;
  if(!free){S.plays[id]=(S.plays[id]||0)+1;save();}
  a.addEventListener("timeupdate",()=>{const f=document.getElementById("fill-"+id);if(f&&a.duration)f.style.width=(a.currentTime/a.duration*100)+"%";});
  a.addEventListener("ended",()=>{if(curKey===id){curAudio=null;curKey=null;render();}});
  a.play().catch(()=>{curAudio=null;curKey=null;render();});
  render();
}
function stopAudio(){if(curAudio)curAudio.pause();curAudio=null;curKey=null;}

/* ---------- TTS examiner ---------- */
const tts=("speechSynthesis" in window);
function say(t){if(!tts)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;speechSynthesis.speak(u);}
const examiner=t=>`<div class="examiner"><span class="who">Prüfer/in</span><span class="say">${esc(t)}</span>${tts?`<button class="spk" data-say="${esc(t)}" aria-label="Vorlesen">🔊</button>`:""}</div>`;

/* ---------- timer ---------- */
let tick=null;
function startClock(){clearInterval(tick);const fn=()=>{const el=$("#clock");if(!S.deadline||!el)return;const ms=S.deadline-Date.now();
  if(ms<=0){clearInterval(tick);el.textContent="00:00";timeUp();return;}
  const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",ms<120000);};fn();tick=setInterval(fn,500);}
function timeUp(){stopAudio();ask(`<h3>Die Zeit ist um.</h3><p>Ihre Antworten im Modul ${modName(S.mod)} werden jetzt abgegeben.</p>`,()=>submitModule(),true);}
const modName=k=>MODS.find(m=>m.k===k).name;

/* ---------- dialog ---------- */
function ask(html,yes,onlyOk){const d=$("#dlg");$("#dlgBody").innerHTML=html;$("#dlgNo").style.display=onlyOk?"none":"";
  $("#dlgYes").onclick=()=>{d.close();yes&&yes();};$("#dlgNo").onclick=()=>d.close();d.showModal?d.showModal():(confirm($("#dlgBody").textContent)&&yes&&yes());}

/* ---------- flow ---------- */
function go(screen,mod){S.screen=screen;if(mod!==undefined)S.mod=mod;save();stopAudio();render();window.scrollTo(0,0);}
function startModule(k){S.mod=k;S.screen="exam";S.review=null;S.deadline=PR()?null:Date.now()+MODS.find(m=>m.k===k).min*60000;
  if(k==="sprechen"&&!S.cards)drawCards();save();render();window.scrollTo(0,0);startClock();}
function submitModule(){clearInterval(tick);stopAudio();S.deadline=null;
  if(S.mod==="schreiben"){S.screen="w2grade";save();render();window.scrollTo(0,0);return;}
  finishModule();}
function finishModule(){S.done[S.mod]=true;
  if(S.full){const nx=MODS.find(m=>!S.done[m.k]);if(nx){S.screen="intro";S.mod=nx.k;save();render();window.scrollTo(0,0);return;}}
  go("results");}
function drawCards(){const sh=a=>a.sort(()=>Math.random()-.5),tp=[...new Set(SP2.map(x=>x.t))];
  const e=sh(SP2.map((x,i)=>i).filter(i=>SP2[i].t===tp[0])),s=sh(SP2.map((x,i)=>i).filter(i=>SP2[i].t===tp[1]));
  S.cards={t2:[e[0],s[0]],t2p:[e[1],s[1]],t3:sh(SP3.map((x,i)=>i)).slice(0,4)};}

/* ---------- views ---------- */
const mast=(sub)=>`<div class="mast"><div class="tag">A1</div><div class="ttl"><b>Goethe-Zertifikat A1: Start Deutsch 1</b><span>${SETS[SET].name} · ${sub}</span></div></div>`;

const modeSwitch=()=>`<div class="modes" role="tablist" aria-label="Modus">

  <button role="tab" aria-selected="${PR()}" class="${PR()?"on":""}" data-mode="practice"><b>Nur üben</b><small>Ohne Zeit, Audio beliebig oft, sofort prüfen</small></button></div>`;
function practiceStatus(k){
  if(k==="hoeren"||k==="lesen"){const parts=k==="hoeren"?HOEREN:LESEN,pre=k[0],ch=parts.filter(p=>S.chk[p.id]);if(!ch.length)return "";
    const real=ch.flatMap(p=>p.items.filter(i=>i.n>0));return `${real.filter(i=>S.ans[pre+i.n]===i.a).length}/${real.length} richtig`;}
  if(k==="schreiben")return S.chk.s1?`Formular ${rawForm()}/5`:"";
  return "";}

function choiceTask(i,p,pre){
  const ex=i.n===0, rv=!!S.review||(PR()&&!!S.chk[p.id]);
  const opts=i.o||(p.tf?["Richtig","Falsch"]:["a","b"]);
  const letters=p.tf?["","" ]:["a","b","c"];
  const sel=ex?i.a:S.ans[pre+i.n];
  const bt=opts.map((o,k)=>{let c="opt";if(sel===k)c+=" sel";if(rv&&!ex){if(k===i.a)c+=" right";else if(sel===k)c+=" wrong";}
    const label=p.ab?(i.tt?`${o}`:`${o}`):o;
    return `<button class="${c}" ${ex||rv?"disabled":""} data-key="${pre+i.n}" data-k="${k}" aria-pressed="${sel===k}"><span class="x"></span>${letters[k]&&!p.ab?`<span class="l">${letters[k]}</span>`:""}<span>${p.ab?`${i.lab||(i.tt?"Verbindung":"Website")} <b>${o}</b>`:esc(label)}</span></button>`;}).join("");
  let media="";
  if(i.s)media=`<div class="sites">${i.s.map((s,k)=>`<div class="site"><div class="u"><i>${"ab"[k]}</i>${esc(s.u)}</div><div class="b">${esc(s.b)}</div></div>`).join("")}</div>`;
  if(i.tt)media=`<div class="sites">${i.tt.map((r,k)=>`<div class="site"><div class="u"><i>${"ab"[k]}</i>www.reiseauskunft.bahn.de</div><div class="b" style="white-space:normal"><table class="tt"><tr><th></th><th>Bahnhof</th><th>Zeit</th></tr><tr><td>ab</td><td>${r[0]}</td><td>${r[1]}</td></tr><tr><td>an</td><td>${r[2]}</td><td>${r[3]}</td></tr></table><small>17.2. · Dauer ${r[4]} · ${r[5]}</small></div></div>`).join("")}</div>`;
  if(i.sign)media=`<div class="sign"><span class="where">${esc(i.where)}</span>${esc(i.sign)}</div>`;
  const pl=i.audio?player(i.audio,ex):"";
  const head=`<div class="thead"><span class="no">${ex?"Beispiel":i.n}</span>${i.ctx?`<span class="ctx">${esc(i.ctx)}</span>`:""}</div>`;
  const body=p.ab?`<div class="q">${esc(i.q)}</div>${media}`:`${media}<div class="q">${esc(i.q)}</div>`;
  return `<div class="task${ex?" bsp":""}">${head}${pl}${body}<div class="opts${p.tf||p.ab?" two":""}">${bt}</div></div>`;
}

   <div class="r"><span>${W.crit[0]} <small class="muted">(3 P.)</small></span>${sel("p1",3)}</div>

async function aiGrade(){
  let sample=null;try{sample=await window.claude?.use?.("sample");}catch(e){}
  if(!sample){gradeErr="Bewertung durch Claude ist hier nicht verfügbar. Bitte bewerten Sie selbst.";render();return;}
  grading=true;gradeErr="";render();
  const prompt=`You are a Goethe-Institut examiner marking Goethe-Zertifikat A1 (Start Deutsch 1), Schreiben Teil 2.
Task given to the candidate: "${W.task} 1) ${W.points[0]} 2) ${W.points[1]} 3) ${W.points[2]} Ca. 30 Wörter, mit Anrede und Gruß."
Marking per content point: 3 = fully addressed and understandable, 1.5 = only partly addressed because of language or content problems, 0 = not addressed or not understandable. Communicative design: 1 = appropriate greeting and closing for the text type, 0.5 = untypical or missing phrases (e.g. no greeting), 0 = none. Judge at A1 level: small spelling/grammar errors are fine if understandable.
Candidate text:
"""${S.letter}"""
Reply with JSON only: {"p1":number,"p2":number,"p3":number,"p4":number,"feedback":"3-5 short sentences in simple English: what was good, what cost points, and a corrected version of any wrong sentence in German"}`;
  try{const r=await sample.json(prompt,{modelTier:"default"});
    const c=(v,m)=>{v=Number(v);const opts=m===3?[0,1.5,3]:[0,.5,1];return opts.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);};
    S.w2={p1:c(r.p1,3),p2:c(r.p2,3),p3:c(r.p3,3),p4:c(r.p4,1),feedback:String(r.feedback||""),by:"Claude"};if(PR())S.w2.total=S.w2.p1+S.w2.p2+S.w2.p3+S.w2.p4;save();
  }catch(e){gradeErr=e&&e.code==="not_granted"?"Keine Erlaubnis erteilt. Bitte bewerten Sie selbst.":e&&e.code==="rate_limited"?"Gerade zu viele Anfragen. Versuchen Sie es gleich noch einmal oder bewerten Sie selbst.":"Die Bewertung hat nicht geklappt. Bitte bewerten Sie selbst.";}
  grading=false;render();
}

L – O – P – E – Z.
Null-eins-sieben-sechs, drei-vier-fünf …</p></details>
   ${rows("Teil 1")}</section>
  <section class="teil" id="t2"><h2>Teil 2</h2><p class="instr">Um Informationen bitten und Informationen geben. Sie ziehen eine Karte und stellen eine Frage. Ein Gruppenmitglied fragt Sie, Sie antworten.</p>
   ${c2.map((x,k)=>`<h3>Runde ${k+1}: Thema „${x.t}“</h3><div class="card" style="max-width:280px;margin:10px 0"><span class="top">Start Deutsch 1 · Sprechen Teil 2 · ${x.t}</span><span class="w">${x.w}</span><small class="muted">Ihre Karte: Stellen Sie eine Frage.</small></div>
     ${examiner(p2[k].q)}
     <details class="box"><summary><b>Beispiel</b></summary><p>Ihre Frage: <i>${esc(x.q)}</i><br>Ihre Antwort: <i>${esc(p2[k].r)}</i></p></details>`).join("")}

   <details class="box"><summary><b>Beispiel</b></summary><p>${c3.slice(0,2).map(x=>`<i>${esc(x.q)}</i>`).join("<br>")}<br>Reaktion: ${c3.slice(2).map(x=>`<i>${esc(x.r)}</i>`).join(" · ")}</p></details>
   ${rows("Teil 3")}</section>
  ${PR()?`<div class="row" style="margin-top:22px"><button class="btn green" data-redraw="1">Neue Karten ziehen</button><button class="btn line" data-go="cover">Zur Übersicht</button></div>`:rv?`<div class="row" style="margin-top:16px"><button class="btn" data-go="results">Zurück zum Ergebnis</button></div>`:`<div class="row" style="margin-top:16px"><button class="btn green" data-submit="1">Sprechen abschließen</button><button class="btn line" data-redraw="1">Neue Karten</button></div>`}</div>`;

/* ---------- render ---------- */
function render(){
  const sc=S.screen;let h="";
  if(sc==="cover")h=vCover();
  else if(sc==="intro")h=vIntro();
  else if(sc==="w2grade")h=vW2();
  else if(sc==="results")h=vResults();
  else if(sc==="exam"){const k=S.mod;h=k==="hoeren"?vChoice(HOEREN,"h","Hören"):k==="lesen"?vChoice(LESEN,"l","Lesen"):k==="schreiben"?vSchreiben():vSprechen();}
  app.innerHTML=`<div class="sheet">${h}</div>`;
  if(sc==="exam"&&!S.review&&S.deadline){startClock();}
}

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const t=e.target, c=sel=>t.closest(sel);
  let x;
  if(x=c("[data-play]")){const id=x.dataset.play;const it=HOEREN.flatMap(p=>p.items).find(i=>i.audio===id);togglePlay(id,it&&it.n===0);return;}
  if(x=c(".opt")){if(x.disabled)return;S.ans[x.dataset.key]=+x.dataset.k;save();const keep=window.scrollY;render();window.scrollTo(0,keep);return;}
  if(x=c("[data-full]")){S.full=true;const nx=MODS.find(m=>!S.done[m.k]);if(!nx){go("results");return;}S.mod=nx.k;go("intro");return;}
  if(x=c("[data-set]")){const k=x.dataset.set;if(k===SET)return;stopAudio();clearInterval(tick);switchSet(k);return;}
  if(x=c("[data-mode]")){const m=x.dataset.mode;if(m===MODE)return;stopAudio();clearInterval(tick);
    if(MODE==="exam"&&S.screen==="exam"&&S.deadline&&!S.review){ask("<h3>Prüfung abbrechen?</h3><p>Ihre Antworten bleiben gespeichert, das laufende Modul startet später neu.</p>",()=>{switchMode(m);});return;}
    switchMode(m);return;}
  if(x=c("[data-pcheck]")){S.chk[x.dataset.pcheck]=1;save();const k=window.scrollY;render();window.scrollTo(0,k);return;}
  if(x=c("[data-pretry]")){const p=[...HOEREN,...LESEN].find(q=>q.id===x.dataset.pretry);delete S.chk[p.id];p.items.forEach(i=>delete S.ans[x.dataset.pre+i.n]);save();render();document.getElementById("t"+(([...HOEREN,...LESEN].filter(q=>q.id[0]===p.id[0]).indexOf(p))+1)).scrollIntoView();return;}
  if(x=c("[data-s1check]")){S.chk.s1=1;save();const k=window.scrollY;render();window.scrollTo(0,k);return;}
  if(x=c("[data-s1retry]")){delete S.chk.s1;S.form={};save();render();return;}
  if(x=c("[data-resetall]")){ask("<h3>Fortschritt zurücksetzen?</h3><p>Alle Antworten und Ergebnisse werden gelöscht: in allen drei Sätzen, im Prüfungs- und im Übungsmodus.</p><p class=\"en\">Clears all answers and results in every set and both modes.</p>",resetAll);return;}
  if(PR()&&(x=c("[data-single]"))){if(!S.cards)drawCards();startModule(x.dataset.single);return;}
  if(x=c("[data-single]")){S.full=false;S.mod=x.dataset.single;if(S.done[S.mod]){ask(`<h3>${modName(S.mod)} noch einmal?</h3><p>Ihre bisherigen Antworten in diesem Modul werden gelöscht.</p>`,()=>{resetModule(S.mod);go("intro");});return;}go("intro");return;}
  if(x=c("[data-start]")){startModule(x.dataset.start);return;}
  if(x=c("[data-go]")){if(S.review){S.review=null;}go(x.dataset.go);return;}
  if(x=c("[data-submit]")){
    let msg="";if(S.mod==="hoeren"||S.mod==="lesen"){const parts=S.mod==="hoeren"?HOEREN:LESEN,pre=S.mod[0];const open=realItems(parts).filter(i=>S.ans[pre+i.n]===undefined).length;if(open)msg=`<p>Sie haben ${open} Aufgabe${open>1?"n":""} nicht beantwortet.</p>`;}
    ask(`<h3>${modName(S.mod)} abgeben?</h3>${msg}<p>Danach können Sie die Antworten nicht mehr ändern.</p>`,submitModule);return;}
  if(x=c("[data-jump]")){const el=document.getElementById(x.dataset.jump);el&&el.scrollIntoView({behavior:"smooth"});return;}
  if(x=c("[data-say]")){say(x.dataset.say);return;}
  if(x=c("[data-sp]")){if(x.disabled)return;S.sp[x.dataset.sp]=+x.dataset.v;save();const k=window.scrollY;render();window.scrollTo(0,k);return;}
  if(x=c("[data-redraw]")){drawCards();save();render();return;}
  if(x=c("[data-w2]")){S.w2=Object.assign({},S.w2||{},{[x.dataset.w2]:+x.dataset.v,by:(S.w2&&S.w2.by)||"selbst"});save();const k=window.scrollY;render();window.scrollTo(0,k);return;}
  if(x=c("[data-ai]")){aiGrade();return;}
  if(x=c("[data-w2done]")){const w=S.w2;w.total=w.p1+w.p2+w.p3+w.p4;save();finishModule();return;}
  if(x=c("[data-review]")){S.review=x.dataset.review;S.mod=x.dataset.review;S.screen="exam";save();render();window.scrollTo(0,0);return;}
  if(x=c("[data-restart]")){ask("<h3>Neue Prüfung beginnen?</h3><p>Alle Antworten und Ergebnisse werden gelöscht.</p>",()=>{const cand=S.cand;S=fresh();S.cand=cand;save();go("cover");});return;}
});
function resetAll(){stopAudio();clearInterval(tick);const cand=S.cand;
  try{Object.keys(localStorage).filter(k=>/^a1-(exam|practice)-/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(e){}
  S=fresh();S.cand=cand;save();render();window.scrollTo(0,0);}
function switchSet(k){save();useSet(k);load();S.screen="cover";S.review=null;save();render();try{history.replaceState(null,"",k==="ms"?location.pathname:"#"+k);}catch(e){}}
function switchMode(m){save();MODE=m;load();S.screen="cover";S.review=null;save();render();window.scrollTo(0,0);}
function resetModule(k){
  if(k==="hoeren"){Object.keys(S.ans).filter(a=>a[0]==="h").forEach(a=>delete S.ans[a]);S.plays={};}
  if(k==="lesen")Object.keys(S.ans).filter(a=>a[0]==="l").forEach(a=>delete S.ans[a]);
  if(k==="schreiben"){S.form={};S.letter="";S.w2=null;}
  if(k==="sprechen"){S.sp={};S.cards=null;}
  delete S.done[k];save();
}
app.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.cand){S.cand[t.dataset.cand]=t.value;save();}
  if(t.dataset.form){S.form[t.dataset.form]=t.value;save();}
  if(t.id==="letter"){S.letter=t.value;save();$("#wc").textContent=words(t.value);}
});
app.addEventListener("change",e=>{const t=e.target;if(t.dataset.radio){S.form[t.name]=t.dataset.radio;save();}});
if(tts)speechSynthesis.getVoices();
if(S.screen==="exam"&&!S.review&&S.deadline&&S.deadline<Date.now()){render();timeUp();}else render();
</script>
</body>
</html>
